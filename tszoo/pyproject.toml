[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tszoo"
version = "0.1.0"
description = "Standalone PyTorch and GluonTS time-series experiments"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5,<2.6",
  "gluonts==0.16.3",
  "lightning==2.4.0",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "safetensors==0.6.2",
  "PyYAML==6.0.3",
  "requests==2.34.2",
]

[project.scripts]
tszoo-evaluate = "tszoo.evaluation.evaluate:main"
tszoo-download = "tszoo.data.download:main"
tszoo-wrmsse = "tszoo.evaluation.wrmsse:main"
tszoo-train = "tszoo.training.trainer:main"
tszoo-prepare = "tszoo.data.prepare:main"

[tool.setuptools]
packages = [
  "tszoo", "tszoo.data", "tszoo.models", "tszoo.models.chronos2",
  "tszoo.models.chronos2.layers", "tszoo.training", "tszoo.evaluation",
]
package-dir = { tszoo = "." }

[tool.setuptools.package-data]
tszoo = ["configs/*.yaml", "data/*.json", "models/chronos2/LICENSE", "models/chronos2/NOTICE.md"]
